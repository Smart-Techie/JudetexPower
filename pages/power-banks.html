<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Power Banks | JudeTex Power</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <meta name="theme-color" content="#0F3D8C">
    <link rel="manifest" href="../manifest.json">
</head>

<body>

    <header class="header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">JUDETEX<span>POWER</span></a>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="power-banks.html" class="nav-link active">Power Banks</a>
                <a href="how-it-works.html" class="nav-link">How It Works</a>
                <a href="track-rental.html" class="nav-link">Track Rental</a>
                <a href="admin-login.html" class="nav-link" style="color:var(--primary); font-weight:700;">Admin</a>
            </nav>
        </div>
    </header>

    <main class="page-wrapper" style="background-color: var(--bg-secondary);">
        <section class="section container content-flex">
            <div class="text-center mb-5">
                <h1 class="mb-2">AVAILABLE POWER BANKS</h1>
                <p style="font-size: 20px; max-width: 600px; margin: 0 auto;">Choose an available power bank and reserve
                    it for your market day.</p>
            </div>

            <div id="powerBankGrid" class="powerbank-grid grid">
                <!-- Power banks populated by JS -->
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="card text-center"
                style="display: none; padding: 64px 24px; max-width: 500px; margin: 0 auto;">
                <div style="font-size: 48px; margin-bottom: 24px;">🚫</div>
                <h3 class="mb-2">NO POWER BANKS AVAILABLE</h3>
                <p>All power banks are currently rented or unavailable.</p>
            </div>

            <!-- Selection Bar -->
            <div id="selectionBar"
                style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 24px; box-shadow: 0 -10px 20px rgba(0,0,0,0.05); z-index: 50; border-top: 1px solid var(--border);">
                <div class="container flex justify-between items-center"
                    style="max-width: 800px; gap: 24px; flex-wrap: wrap;">
                    <div>
                        <div
                            style="font-size: 14px; font-weight: 600; color: var(--text-light); text-transform: uppercase;">
                            SELECTED POWER BANK</div>
                        <div class="flex items-center gap-2 mt-1">
                            <div id="selectedPbId" style="font-size: 28px; font-weight: 700; color: var(--primary);">
                                PB-000</div>
                            <div style="font-size: 18px; font-weight: 600; color: var(--accent);">₦500 / MARKET DAY
                            </div>
                        </div>
                    </div>
                    <button id="continueBtn" class="btn btn-primary"
                        style="padding: 16px 40px; font-size: 18px; width: auto; flex-grow: 1; max-width: 300px;">CONTINUE</button>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/app.js"></script>
    <script type="module">
        import '../js/db.js';   // populates window.SupabaseDB

        const DB = window.SupabaseDB;
        const { Storage, showToast } = window.JudetexUtils;

        // Clear any old, stale rental reservation state from previous aborted attempts
        Storage.remove('current_rental_request');

        let selectedPowerBank = null;

        // ── Loading state ──────────────────────────────────────────────
        const pbGrid = document.getElementById('powerBankGrid');
        const emptyDiv = document.getElementById('emptyState');

        // Show spinner while we wait
        pbGrid.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-light);grid-column:1/-1;">Loading available power banks…</div>';

        // ── Fetch ───────────────────────────────────────────────
        const availablePBs = await DB.getPowerBanks('AVAILABLE');
        pbGrid.innerHTML = '';

        if (availablePBs.length === 0) {
            emptyDiv.style.display = 'block';
        } else {
            availablePBs.forEach(pb => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.cursor = 'pointer';

                const imgUrl = pb.imageUrl || '../assets/images/power-bank.jpeg';

                card.innerHTML = `
                    <div style="margin-bottom: 16px; background: #FAFCFF; border-radius: 8px; padding: 16px; min-height: 140px; display: flex; align-items: center; justify-content: center;">
                        <img src="${imgUrl}" alt="Power Bank ${pb.id}" style="height: 120px; object-fit: contain;">
                    </div>
                    <div class="product-id" style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">${pb.id}</div>
                    <div class="flex items-center justify-center gap-2 mb-3">
                        <span class="badge badge-success pb-status-badge">● AVAILABLE</span>
                    </div>
                    <div class="product-price" style="font-size:20px;font-weight:700;color:var(--text-body);margin-bottom:16px;">₦500 <span style="font-size:14px;font-weight:600;color:var(--text-light);">/ DAY</span></div>
                    <button class="btn btn-outline w-full pb-select-btn" data-id="${pb.id}">SELECT</button>
                `;

                card.addEventListener('click', () => selectPowerBank(pb.id, card));
                pbGrid.appendChild(card);
            });
        }

        // ── Selection logic ────────────────────────────────────────────
        function selectPowerBank(id, cardElement) {
            document.querySelectorAll('.product-card').forEach(c => {
                c.classList.remove('selected');
                c.style.borderColor = 'var(--border)';
                c.style.boxShadow = 'none';
                c.style.backgroundColor = 'white';

                const badge = c.querySelector('.pb-status-badge');
                if (badge) {
                    badge.className = 'badge badge-success pb-status-badge';
                    badge.innerText = '● AVAILABLE';
                }

                const btn = c.querySelector('.pb-select-btn');
                if (btn) {
                    btn.className = 'btn btn-outline w-full pb-select-btn';
                    btn.innerText = 'SELECT';
                }
            });

            cardElement.classList.add('selected');
            cardElement.style.borderColor = 'var(--accent)';
            cardElement.style.boxShadow = '0 0 0 4px rgba(255,107,0,0.1)';
            cardElement.style.backgroundColor = '#FFFBF7';

            const badge = cardElement.querySelector('.pb-status-badge');
            if (badge) {
                badge.className = 'badge pb-status-badge';
                badge.style.background = '#FFE4E6';
                badge.style.color = 'var(--accent)';
                badge.innerText = '● SELECTED';
            }

            const btn = cardElement.querySelector('.pb-select-btn');
            if (btn) {
                btn.className = 'btn btn-primary w-full pb-select-btn';
                btn.innerText = 'PROCEED TO RENT';
            }

            selectedPowerBank = id;

            const bar = document.getElementById('selectionBar');
            const displayId = document.getElementById('selectedPbId');
            if (bar && displayId) {
                displayId.innerText = id;
                bar.style.display = 'block';
                document.body.style.paddingBottom = '120px';
            }
        }

        // Add a global click handler for the 'btn' inside the card to directly proceed
        pbGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('pb-select-btn') && e.target.innerText === 'PROCEED TO RENT') {
                // user clicked the PROCEED TO RENT button explicitly
                if (selectedPowerBank) {
                    Storage.set('current_rental_request', { powerBankId: selectedPowerBank });
                    window.location.href = 'customer-details.html';
                }
            }
        });

        const continueBtn = document.getElementById('continueBtn');
        if (continueBtn) {
            continueBtn.addEventListener('click', () => {
                if (selectedPowerBank) {
                    Storage.set('current_rental_request', { powerBankId: selectedPowerBank });
                    window.location.href = 'customer-details.html';
                }
            });
        }
    </script>
</body>

</html>
