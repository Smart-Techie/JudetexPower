<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Management | JudeTex Power</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body style="background-color: var(--primary);">

    <div
        style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px;">

        <div style="text-align: center; margin-bottom: 32px;">
            <a href="../index.html" class="logo"
                style="color: white; justify-content: center; font-size: 32px;">JUDETEX<span
                    style="color: var(--accent);">POWER</span></a>
            <div style="color: rgba(255,255,255,0.7); font-weight: 500; margin-top: 8px; letter-spacing: 2px;">BUSINESS
                MANAGEMENT</div>
        </div>

        <div class="card p-5" style="width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">

            <form id="adminLoginForm">

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" autocomplete="username" required>
                </div>

                <div class="form-group" style="position: relative;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                    <button type="button" id="togglePassword"
                        style="position: absolute; right: 16px; top: 40px; background: none; border: none; font-size: 14px; font-weight: 600; color: var(--primary); cursor: pointer;">SHOW</button>
                </div>

                <div id="loginError" class="form-error text-center mb-3">Invalid email or password.</div>

                <button type="submit" id="loginBtn" class="btn btn-primary w-full"
                    style="padding: 16px; font-size: 18px;">LOGIN</button>

            </form>
        </div>

        <div style="margin-top: 32px; color: rgba(255,255,255,0.5); font-size: 14px;">
            Secured by Supabase Auth. Admin access only.
        </div>

    </div>

    <!-- Supabase DB module — sets window.SupabaseDB -->
    <script type="module" src="../js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const form = document.getElementById('adminLoginForm');
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleBtn.innerText = 'HIDE';
                } else {
                    passwordInput.type = 'password';
                    toggleBtn.innerText = 'SHOW';
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.style.display = 'none';
                btn.innerText = 'AUTHENTICATING…';
                btn.disabled = true;

                // Wait for the ES module to populate window.SupabaseDB
                const waitForDB = () => new Promise(resolve => {
                    if (window.SupabaseDB) return resolve();
                    const t = setInterval(() => { if (window.SupabaseDB) { clearInterval(t); resolve(); } }, 50);
                });
                await waitForDB();

                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;

                const { success, error } = await window.SupabaseDB.adminSignIn(email, password);

                if (success) {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = error || 'Invalid email or password.';
                    btn.innerText = 'LOGIN';
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
